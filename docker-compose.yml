name: ecommerce

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ecommerce:ecommerce@db:5432/ecommerce
      CHECKOUT_FINGERPRINT_SECRET: local-development-checkout-secret-change-me
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "ecommerce.healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20

  ci:
    build:
      context: .
      dockerfile: testing/Dockerfile
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://ecommerce:ecommerce@db:5432/ecommerce_test
      SMOKE_BASE_URL: http://frontend:8080
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: "no"

  e2e:
    profiles: ["e2e"]
    build:
      context: testing/e2e
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    environment:
      E2E_BASE_URL: http://frontend:8080
    volumes:
      - ./.cache/ms-playwright:/ms-playwright
      - ./testing/e2e/results:/e2e/results
    depends_on:
      frontend:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
