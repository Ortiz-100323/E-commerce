[project]
name = "ecommerce"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "import-linter>=2.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "../testing"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ecommerce", "fakes", "problems"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
pythonpath = ["../testing/backend"]

[tool.importlinter]
root_package = "ecommerce"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Weather layers: api and infrastructure depend on application, which depends on domain"
type = "layers"
layers = [
    "ecommerce.weather.api | ecommerce.weather.infrastructure",
    "ecommerce.weather.application",
    "ecommerce.weather.domain",
]

[[tool.importlinter.contracts]]
name = "Shared kernel layers: api and infrastructure depend on application, which depends on domain"
type = "layers"
layers = [
    "ecommerce.shared_kernel.api | ecommerce.shared_kernel.infrastructure",
    "ecommerce.shared_kernel.application",
    "ecommerce.shared_kernel.domain",
]

[[tool.importlinter.contracts]]
name = "Catalog layers: api and infrastructure depend on application, which depends on domain"
type = "layers"
layers = [
    "ecommerce.catalog.api | ecommerce.catalog.infrastructure",
    "ecommerce.catalog.application",
    "ecommerce.catalog.domain",
]

[[tool.importlinter.contracts]]
name = "Catalog domain depends only on the shared kernel domain"
type = "forbidden"
source_modules = ["ecommerce.catalog.domain"]
forbidden_modules = [
    "ecommerce.weather",
    "ecommerce.shared_kernel.application",
    "ecommerce.shared_kernel.infrastructure",
    "ecommerce.shared_kernel.api",
]

[[tool.importlinter.contracts]]
name = "Domain and application stay free of frameworks"
type = "forbidden"
source_modules = [
    "ecommerce.catalog.domain",
    "ecommerce.catalog.application",
    "ecommerce.weather.domain",
    "ecommerce.weather.application",
    "ecommerce.shared_kernel.domain",
    "ecommerce.shared_kernel.application",
]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "pydantic", "pydantic_settings", "httpx", "alembic"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["src", "migrations"]
