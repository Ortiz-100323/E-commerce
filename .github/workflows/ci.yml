name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Checks, tests and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the code (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Start the stack
        run: docker compose up --detach --build --wait db backend frontend

      - name: Run every check in the ci container
        run: docker compose run --rm ci

      - name: Check that no container runs as root
        run: python3 testing/run.py containers

      - name: Check the image sizes
        run: python3 testing/run.py images

      - name: Check the README and the decision records
        run: python3 testing/run.py docs

      - name: Restore the Playwright browser cache (actions/cache v6.1.0)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/ms-playwright
          key: playwright-chromium-headless-shell-${{ runner.os }}-${{ hashFiles('testing/e2e/package-lock.json') }}

      - name: Run the browser tests
        run: |
          mkdir -p .cache/ms-playwright testing/e2e/results
          E2E_UID="$(id -u)" E2E_GID="$(id -g)" docker compose --profile e2e run --rm --build e2e

      - name: Upload the browser test results (actions/upload-artifact v7.0.2)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-results
          path: testing/e2e/results
          retention-days: 7

      - name: Show the container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose --profile e2e down --volumes
